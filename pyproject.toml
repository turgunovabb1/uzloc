[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uzloc"
version = "0.4.0"
description = "Uzbek localization toolkit: Latin-Cyrillic transliteration, an EN-UZ-RU IT glossary and translation QA tools."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Abbos Turgunov" }]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
uzloc = "uzloc.cli:main"

[tool.setuptools.packages.find]
include = ["uzloc*"]

[tool.setuptools.package-data]
uzloc = ["data/*.csv"]